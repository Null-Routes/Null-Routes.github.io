<header class="site-nav">
  <nav class="site-nav__inner" aria-label="Primary">
    <a class="site-nav__brand" href="{{ '/' | relative_url }}">Null Routes</a>
    <ul class="site-nav__links">
      {% for item in site.data.navigation %}
      <li>
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </nav>
</header>
