<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title and page.url != '/' %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <meta name="theme-color" content="#020617" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% for css in page.styles %}
  <link rel="stylesheet" href="{{ css | relative_url }}" />
  {% endfor %}
</head>
<body>
  {% include nav.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  {% for js in page.scripts %}
  <script src="{{ js | relative_url }}" defer></script>
  {% endfor %}
</body>
</html>
